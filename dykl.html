<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do You Know Your Loveyy?</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161216; --milk:#fff8f6; --pink:#ff5c9d; --blush:#ffd6e6;
    --good:#1f9d63; --bad:#e0425a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif; font-weight:600; color:var(--ink);
    background:var(--milk);
    background-image:radial-gradient(var(--blush) 2px, transparent 2px);
    background-size:28px 28px;
    display:flex; align-items:center; justify-content:center; padding:20px;
    min-height:100vh;
  }
  .card{
    width:100%; max-width:480px; background:#fff; border:3px solid var(--ink);
    border-radius:28px; box-shadow:8px 8px 0 var(--ink); padding:28px 24px;
  }
  h1,h2{font-family:'Bagel Fat One','Nunito',sans-serif; font-weight:400; margin:0; line-height:1.1}
  .hero{text-align:center}
  .hero h1{font-size:clamp(2.2rem,9vw,3.2rem)}
  .hero p{margin:14px 0 26px}
  .heart-big{font-size:3.5rem; display:inline-block; animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .btn{
    font:inherit; font-weight:800; font-size:1.1rem; cursor:pointer;
    background:var(--pink); color:var(--ink); border:3px solid var(--ink); border-radius:999px;
    padding:12px 30px; box-shadow:4px 4px 0 var(--ink); transition:transform .08s, box-shadow .08s;
  }
  .btn:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
  .btn:focus-visible,.opt:focus-visible{outline:3px dashed var(--pink); outline-offset:3px}
  .btn.dark{background:var(--ink); color:#fff}
  .name{font:inherit; font-weight:800; width:100%; max-width:280px; text-align:center; padding:12px 14px; margin:0 0 18px; border:3px solid var(--ink); border-radius:999px; background:#fff}
  .name:focus-visible{outline:3px dashed var(--pink); outline-offset:3px}
  .small{margin:18px 0 0; font-size:.9rem} .small a{color:var(--ink)}
  .card:has(#board.active){max-width:560px}
  #board h1{font-family:'Bagel Fat One',sans-serif; font-weight:400; font-size:2rem; margin:0 0 4px; text-align:center}
  #board .sub{text-align:center; margin:0 0 16px; opacity:.75}
  #board .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px}
  #board .stat{border:2px solid var(--ink); border-radius:14px; padding:10px; text-align:center; background:var(--blush)}
  #board .stat b{display:block; font-family:'Bagel Fat One',sans-serif; font-weight:400; font-size:1.5rem}
  #board .stat span{font-size:.8rem}
  #board .wrap{overflow-x:auto}
  #board table{width:100%; border-collapse:collapse; min-width:420px}
  #board th,#board td{text-align:left; padding:10px 8px; border-bottom:2px solid #eee; white-space:nowrap}
  #board th{border-bottom:3px solid var(--ink); font-weight:800}
  #board .tag{display:inline-block; padding:2px 10px; border-radius:99px; border:2px solid var(--ink); font-size:.8rem; font-weight:800; background:#eee}
  #board .tag.yes{background:#c9f2dc}
  #board .tag.live{background:var(--pink); animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.55}}
  #board .none{text-align:center; padding:24px 0; display:none}
  #board .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px}
  .btn.light{background:#fff}
  .screen{display:none}
  .screen.active{display:block}
  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-weight:800}
  .bar{height:12px; border:2px solid var(--ink); border-radius:99px; overflow:hidden; margin-bottom:22px}
  .bar i{display:block; height:100%; background:var(--pink); width:0; transition:width .4s}
  h2{font-size:1.6rem; margin-bottom:6px}
  .clue{margin:0 0 4px; font-size:.95rem; opacity:.75}
  .opts{display:grid; gap:12px; margin-top:18px}
  .opt{
    font:inherit; font-weight:800; text-align:left; cursor:pointer; background:#fff;
    border:3px solid var(--ink); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center;
    transition:background .15s, transform .08s;
  }
  .opt b{
    flex:none; width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff;
    display:grid; place-items:center; font-size:.9rem;
  }
  .opt:not(:disabled):hover{background:var(--blush)}
  .opt:disabled{cursor:default}
  .opt.correct{background:#c9f2dc; border-color:var(--good)}
  .opt.correct b{background:var(--good)}
  .opt.wrong{background:#ffd3da; border-color:var(--bad)}
  .opt.wrong b{background:var(--bad)}
  .msg{
    margin-top:18px; padding:14px 16px; border-radius:16px; background:var(--blush); border:2px dashed var(--ink);
    display:none;
  }
  .msg.show{display:block; animation:pop .3s}
  @keyframes pop{from{transform:scale(.9); opacity:0}to{transform:scale(1); opacity:1}}
  .msg strong{display:block; margin-top:6px; color:var(--pink); -webkit-text-stroke:0}
  .next{margin-top:18px; text-align:right; display:none}
  .next.show{display:block}
  .result{text-align:center}
  .score{font-family:'Bagel Fat One',sans-serif; font-size:4.5rem; line-height:1; margin:12px 0 4px}
  .result p{margin:6px 0}
  .result .btn{margin-top:20px}
  .loading,.done{display:none; margin-top:20px}
  .loading.show,.done.show{display:block; animation:pop .3s}
  .spin{width:44px; height:44px; margin:0 auto 10px; border:5px solid var(--blush); border-top-color:var(--pink); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done p{font-weight:800; font-size:1.1rem}
  .done .btn{margin-top:6px; text-decoration:none; display:inline-block}
  .fx{position:fixed; top:-40px; pointer-events:none; z-index:50; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.9}}
  @media (prefers-reduced-motion:reduce){
    .heart-big,.spin,#board .tag.live{animation:none} .fx{display:none}
  }
</style>
</head>
<body>
<main class="card">

  <!-- Front page -->
  <section class="screen active hero" id="start">
    <div class="heart-big" aria-hidden="true">🖤</div>
    <h1>DO YOU KNOW YOUR LOVEYY?</h1>
    <p>4 questions about Leilei. 500 pts each.</p>
    <input class="name" id="nameInput" type="text" maxlength="24" placeholder="Your name, loveyy" aria-label="Your name" autocomplete="off">
    <button class="btn" id="playBtn">Play</button>
  </section>

  <!-- Question page (one question per page) -->
  <section class="screen" id="quiz">
    <div class="top"><span id="qCount"></span><span id="liveScore"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <h2 id="qText"></h2>
    <p class="clue" id="qClue"></p>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="next" id="next"><button class="btn dark" id="nextBtn">Next</button></div>
  </section>

  <!-- Result page -->
  <section class="screen result" id="end">
    <h2>Your score</h2>
    <div class="score" id="finalScore">0</div>
    <p id="finalCorrect"></p>
    <p id="finalNote"></p>
    <button class="btn" id="cashBtn">Convert points to cash</button>
    <div class="loading" id="loading" aria-live="polite">
      <div class="spin" aria-hidden="true"></div>
      <p id="loadText">Converting your points...</p>
      <div class="bar"><i id="loadFill"></i></div>
    </div>
    <div class="done" id="done" aria-live="polite">
      <p id="doneText"></p>
    </div>
  </section>

  <!-- Scoreboard (same data as the quiz, updates live) -->
  <section class="screen" id="board">
    <h1>Scoreboard</h1>
    <p class="sub">Who answered the quiz</p>
    <p class="sub" id="mode" style="margin-top:-12px;font-size:.85rem">Connecting...</p>
    <div class="stats">
      <div class="stat"><b id="sPlayers">0</b><span>Players</span></div>
      <div class="stat"><b id="sBest">0</b><span>Best score</span></div>
      <div class="stat"><b id="sConv">0</b><span>Converted</span></div>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>#</th><th>Name</th><th>Correct</th><th>Points</th><th>Status</th><th>When</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="none" id="none">No one has played yet.</p>
    <div class="actions">
      <button class="btn" id="backBtn">Back to quiz</button>
      <button class="btn light" id="clearBtn">Clear scores</button>
    </div>
  </section>

</main>

<script>
  // LIVE SCORES ACROSS DEVICES (free, no account): uses the public ntfy.sh service.
  // Anyone who knows this topic name can read it, so keep it random.
  // dykl.html and scores.html must use the SAME topic.
  const TOPIC = 'dykl-leilei-q7x2m9k4';
  const NTFY = 'https://ntfy.sh/' + TOPIC;

  const POINTS_PER_CORRECT = 500;
  // A missed answer shows the "let it slide" message AND still earns the 500 pts.
  const POINTS_ON_SLIDE = true;

  const questions = [
    { q:"What's Leilei's favorite color?", options:["Black","White","Pink","Red"], answer:0 },
    { q:"Is Leilei genggeng?", options:["Yes","No"], answer:1 },
    { q:"Who is Leilei's first child?", clue:"Clue: black and white", options:["Charcoal","Mocha","Maple","Loki"], answer:1 },
    { q:"How Leilei call Fayy?", options:["Hi bai","Hellaw loveyyyy","Annyeong","Hoy"], answer:1 }
  ];

  let index = 0, score = 0, correctCount = 0, playerName = '', entryId = 0;
  const $ = id => document.getElementById(id);
  const show = id => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  };

  // Send the name to the scoreboard as soon as it's typed
  $('nameInput').addEventListener('input', () => {
    const v = $('nameInput').value.trim();
    if (!entryId){
      if (!v) return;
      entryId = Date.now();
      saveEntry({ id: entryId, name: v, score: 0, correct: 0, total: questions.length, current: 0, answered: 0, status: 'name', converted: false, time: entryId });
    } else {
      updateEntry({ name: v || 'Anonymous loveyy' });
    }
  });

  $('playBtn').onclick = () => {
    playerName = $('nameInput').value.trim() || 'Anonymous loveyy';
    index = 0; score = 0; correctCount = 0;
    if (!entryId){
      entryId = Date.now();
      saveEntry({ id: entryId, name: playerName, score: 0, correct: 0, total: questions.length, current: 1, answered: 0, status: 'playing', converted: false, time: entryId });
    } else {
      updateEntry({ name: playerName, score: 0, correct: 0, current: 1, answered: 0, status: 'playing' });
    }
    show('quiz'); renderQuestion();
  };

  function renderQuestion(){
    const item = questions[index];
    updateEntry({ current: index + 1 });
    $('qCount').textContent = `Question ${index+1} of ${questions.length}`;
    $('liveScore').textContent = `${score} pts`;
    $('barFill').style.width = (index/questions.length*100) + '%';
    $('qText').textContent = item.q;
    $('qClue').textContent = item.clue || '';
    $('msg').className = 'msg'; $('next').className = 'next';
    $('nextBtn').textContent = index === questions.length-1 ? 'See my score' : 'Next';
    const box = $('opts'); box.innerHTML = '';
    item.options.forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = `<b>${'ABCD'[i]}</b><span></span>`;
      b.lastChild.textContent = text;
      b.onclick = () => answer(i);
      box.appendChild(b);
    });
  }

  function answer(choice){
    const item = questions[index];
    const buttons = [...document.querySelectorAll('.opt')];
    buttons.forEach((b,i) => {
      b.disabled = true;
      if (i === item.answer) b.classList.add('correct');
      else if (i === choice) b.classList.add('wrong');
    });
    const right = choice === item.answer;
    const msg = $('msg');
    if (right){
      score += POINTS_PER_CORRECT; correctCount++;
      msg.innerHTML = `Correct! 🎉<strong>+${POINTS_PER_CORRECT} pts</strong>`;
      burst(18, ['💖','✨']);
    } else {
      const ans = item.options[item.answer];
      let earned = '';
      if (POINTS_ON_SLIDE){ score += POINTS_PER_CORRECT; earned = `<strong>+${POINTS_PER_CORRECT} pts</strong>`; }
      msg.innerHTML = `The actual answer is ${ans}, but since you are pretty as heck, I'll let it slide hehe 💕${earned}`;
    }
    $('liveScore').textContent = `${score} pts`;
    updateEntry({ score, correct: correctCount, answered: index + 1 });
    msg.classList.add('show');
    $('next').classList.add('show');
    $('nextBtn').focus();
  }

  $('nextBtn').onclick = () => {
    index++;
    if (index < questions.length) renderQuestion(); else finish();
  };

  function finish(){
    $('finalScore').textContent = score;
    $('finalCorrect').textContent = `${correctCount} of ${questions.length} correct`;
    $('finalNote').textContent = score === 2000
      ? "Perfect score! You really do know your loveyy 🖤"
      : "Nice try, loveyy. Still pretty as heck.";
    updateEntry({ score, correct: correctCount, status: 'finished' });
    show('end');
    celebrate();
  }

  // Confetti + hearts (plain DOM particles)
  function burst(n, glyphs){
    const colors = ['#ff5c9d','#161216','#ffd6e6','#ffffff','#ffb703'];
    for (let i=0;i<n;i++){
      const el = document.createElement('div');
      el.className = 'fx';
      const heart = glyphs && Math.random() < .6;
      if (heart){
        el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
        el.style.fontSize = (16 + Math.random()*20) + 'px';
      } else {
        el.style.width = (6 + Math.random()*8) + 'px';
        el.style.height = (10 + Math.random()*10) + 'px';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.border = '1px solid #161216';
      }
      el.style.left = Math.random()*100 + 'vw';
      el.style.animationDuration = (2 + Math.random()*2.5) + 's';
      el.style.animationDelay = (Math.random()*.6) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5500);
    }
  }
  function celebrate(){
    burst(90, ['💖','🖤','💕','💗']);
    setTimeout(() => burst(60, ['💖','💕']), 900);
  }

  function readScores(){
    try { return JSON.parse(localStorage.getItem('loveyyScores')) || []; } catch(e){ return []; }
  }
  function writeScores(list){
    try { localStorage.setItem('loveyyScores', JSON.stringify(list)); } catch(e){}
    try { new BroadcastChannel('loveyy-scores').postMessage('update'); } catch(e){}
  }
  function saveEntry(entry){ entry.upd = Date.now(); const l = readScores(); l.push(entry); writeScores(l); pushRemote(entry); }
  function updateEntry(patch){
    const list = readScores().map(e => e.id === entryId ? { ...e, ...patch, upd: Date.now() } : e);
    writeScores(list);
    pushRemote(list.find(e => e.id === entryId));
  }
  let pushTimer = null, pushPending = null;
  function pushRemote(entry){
    if (!entry) return;
    pushPending = entry;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => {
      fetch(NTFY, { method: 'POST', body: JSON.stringify(pushPending) }).catch(() => {});
    }, 400);
  }
  function markConverted(){ updateEntry({ converted: true }); }

  // Pretend loading, then show the converted message
  $('cashBtn').onclick = () => {
    $('cashBtn').style.display = 'none';
    $('loading').classList.add('show');
    const steps = ['Converting your points...', 'Contacting GCash...', 'Almost there...'];
    let pct = 0, t = 0;
    const timer = setInterval(() => {
      pct = Math.min(100, pct + 2 + Math.random()*4);
      $('loadFill').style.width = pct + '%';
      t = Math.min(steps.length-1, Math.floor(pct/34));
      $('loadText').textContent = steps[t];
      if (pct >= 100){ clearInterval(timer); setTimeout(sendPoints, 300); }
    }, 90);
  };

  function sendPoints(){
    markConverted();
    $('loading').classList.remove('show');
    $('doneText').textContent = 'Your points has been converted, it would take 10-20 minutes to show up on GCash, thank youuu 💖';
    $('done').classList.add('show');
    burst(40, ['💖','💕']);
    countDown(score);
  }

  // Gradually drain the displayed score to 0 after converting
  function countDown(from){
    const el = $('finalScore');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dur = reduce ? 0 : 2500;
    const start = performance.now();
    function tick(now){
      const t = dur ? Math.min(1, (now - start) / dur) : 1;
      el.textContent = Math.round(from * (1 - t));
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ---------- Scoreboard ----------
  // dykl.html opens on the quiz; scores.html is the same code that opens here.
  const START_VIEW = 'quiz';
  let boardTimer = null;
  function openBoard(){ show('board'); startRemote(); renderBoard(); clearInterval(boardTimer); boardTimer = setInterval(renderBoard, 1000); }
  let remote = {}, es = null;
  const clearedAt = () => +(localStorage.getItem('loveyyClearedAt') || 0);
  function startRemote(){
    if (es || !window.EventSource) return;
    es = new EventSource(NTFY + '/sse?since=12h');
    es.onopen = () => { $('mode').textContent = 'Live from all devices'; };
    es.onerror = () => { $('mode').textContent = 'Reconnecting... showing what this browser knows'; };
    es.onmessage = ev => {
      try {
        const m = JSON.parse(ev.data);
        if (m.event && m.event !== 'message') return;
        if (m.time <= clearedAt()) return;
        const e = JSON.parse(m.message);
        if (e && e.id){ remote[e.id] = e; renderBoard(); }
      } catch(err){}
    };
  }
  function renderBoard(){
    const merged = {};
    readScores().forEach(e => merged[e.id] = e);
    Object.values(remote).forEach(e => { if (!merged[e.id] || (e.upd || 0) >= (merged[e.id].upd || 0)) merged[e.id] = e; });
    const list = Object.values(merged).sort((a,b) => b.score - a.score || a.time - b.time);
    $('sPlayers').textContent = list.length;
    $('sBest').textContent = list.length ? Math.max(...list.map(e => e.score)) : 0;
    $('sConv').textContent = list.filter(e => e.converted).length;
    $('none').style.display = list.length ? 'none' : 'block';
    const body = $('rows'); body.innerHTML = '';
    list.forEach((e, i) => {
      const tr = document.createElement('tr');
      const playing = e.status === 'playing';
      const label = e.converted ? 'Converted' : e.status === 'name' ? 'Entered name' : playing ? `Answered ${e.answered || 0}/${e.total}` : 'Finished';
      const cls = e.converted ? 'yes' : (playing || e.status === 'name') ? 'live' : '';
      const when = new Date(e.time).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
      [i === 0 ? '👑' : i+1, e.name, `${e.correct} / ${e.total}`, e.score, null, when].forEach((v, j) => {
        const td = document.createElement('td');
        if (j === 4){ const t = document.createElement('span'); t.className = 'tag ' + cls; t.textContent = label; td.appendChild(t); }
        else td.textContent = v;
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }
  $('backBtn').onclick = () => { clearInterval(boardTimer); show('start'); };
  $('clearBtn').onclick = () => {
    if (confirm('Clear all saved scores?')){ try { localStorage.removeItem('loveyyScores'); localStorage.setItem('loveyyClearedAt', String(Math.floor(Date.now()/1000))); } catch(e){} remote = {}; renderBoard(); }
  };
  window.addEventListener('storage', () => { if ($('board').classList.contains('active')) renderBoard(); });
  if (START_VIEW === 'scores') openBoard();
</script>
</body>
</html>
